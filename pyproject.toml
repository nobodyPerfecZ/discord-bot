[project]
name = "discord-bot"
version = "0.0.1"
description = "A Music Bot for Discord Servers!"
authors = [
    { name = "Dennis Jabs" }
]
requires-python = ">=3.10"
readme = "README.md"
license = { file = "LICENSE" }

dependencies = [
    "discord.py>=2.4.0",
    "discord.py[voice]>=2.4.0",
    "yt-dlp>=2024.12.3",
    "PyYAML>=6.0.2",
    "ollama>=0.4.8",
]

[dependency-groups]
dev = [
    "black>=23.7.0",
    "flake8>=7.3.0",
    "isort>=5.12.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.14.1",
]

[project.urls]
Homepage = "https://github.com/nobodyPerfecZ/discord-bot"
Issues = "https://github.com/nobodyPerfecZ/discord-bot/issues"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
